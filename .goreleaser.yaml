# goreleaser build/release config. Validate with `goreleaser check`.
# Release: push a tag (e.g. v0.1.0); the release workflow runs `goreleaser release`.
version: 2

project_name: cc-proxy

before:
  hooks:
    - go mod tidy

builds:
  - id: cc-proxy
    main: .
    binary: cc-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/sanketsudake/cc-proxy/internal/version.Version={{ .Version }} -X github.com/sanketsudake/cc-proxy/internal/version.Commit={{ .ShortCommit }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Homebrew tap (macOS cask for the prebuilt binary). Requires the
# `sanketsudake/homebrew-tap` repo and a HOMEBREW_TAP_GITHUB_TOKEN secret (a
# fine-grained PAT scoped to that tap repo with Contents: read/write) so
# goreleaser can push the generated cask there during a release. Linux users
# install via the tarball or `go install`.
homebrew_casks:
  - name: cc-proxy
    repository:
      owner: sanketsudake
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/sanketsudake/cc-proxy"
    description: "Transparent logging proxy between Claude Code and the Anthropic API"
    # Strip the quarantine xattr so the unsigned binary runs without a Gatekeeper prompt.
    #
    # This is the body GoReleaser's own deprecation notice prescribes for
    # hooks.post.install_steps, but that key ships in v2.19; until then the only
    # way to emit `postflight_steps` is custom_block, because GoReleaser still
    # wraps hooks.post.install in Homebrew's deprecated `postflight`.
    # The {{ "..." }} escape is needed because GoReleaser templates the rendered
    # cask once, and would otherwise read {{staged_path}} as one of its own
    # template calls.
    #
    # TODO(goreleaser#6873): on v2.19, delete custom_block and use
    #   hooks:
    #     post:
    #       install_steps: |
    #         on_macos do
    #           run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/cc-proxy"], must_succeed: false
    #         end
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:         ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/cc-proxy"],
              must_succeed: false
        end
      end
