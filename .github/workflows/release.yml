name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + upload archives

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew cask push to sanketsudake/homebrew-tap. Reuse the same
          # fine-grained PAT (Contents: read/write on that tap repo) saved as
          # this secret. Without it, add `--skip=homebrew` to args above.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
