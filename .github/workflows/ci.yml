name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The flake is how this CLI reaches nix users (sanketsudake/dotfiles installs
  # it that way), and its vendorHash goes stale whenever go.sum moves. Building
  # it here makes the PR that moves go.sum go red, instead of the break landing
  # on a machine downstream.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Build the flake package
        run: nix build .#cc-proxy --print-build-logs
      - name: Smoke-test the built binary
        run: ./result/bin/cc-proxy --version
